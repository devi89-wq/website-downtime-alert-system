---
- name: Configure Nagios Monitoring Server
  hosts: monitor
  become: yes

  vars:
    nagios_admin_email: "devisingh876415@gmail.com"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Nagios and plugins
      apt:
        name:
          - nagios4
          - nagios4-cgi
          - nagios-plugins
        state: present

    - name: Deploy website monitoring configuration
      copy:
        src: ../../monitoring/nagios/website.cfg
        dest: /etc/nagios4/conf.d/website.cfg
        owner: root
        group: root
        mode: '0644'

    - name: Configure Nagios administrator email
      lineinfile:
        path: /etc/nagios4/objects/contacts.cfg
        regexp: '^\s*email\s+'
        line: "    email                    {{ nagios_admin_email }}"
      notify: Restart Nagios

    - name: Validate Nagios configuration
      command: nagios4 -v /etc/nagios4/nagios.cfg
      register: nagios_validation
      changed_when: false

    - name: Ensure Nagios is running
      service:
        name: nagios4
        state: restarted
        enabled: yes

  handlers:
    - name: Restart Nagios
      service:
        name: nagios4
        state: restarted
