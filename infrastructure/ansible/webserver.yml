---
- name: Configure Website Web Server
  hosts: webserver
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Ensure Nginx is running
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Deploy test website
      copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Website Downtime Alert System</title>
          </head>
          <body>
              <h1>Website Downtime Alert System</h1>
              <p>Web Server is running successfully.</p>
              <p>Managed automatically using Ansible.</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        mode: '0644'
