define host {
    use                     generic-host
    host_name               monitored-website
    alias                   Website Downtime Alert System
    address                 192.168.56.10
    check_command            check-host-alive
    max_check_attempts       3
    check_interval           1
    retry_interval           1
}

define service {
    use                     generic-service
    host_name               monitored-website
    service_description     HTTP Website Availability
    check_command            check_http
    max_check_attempts       3
    check_interval           1
    retry_interval           1
}
